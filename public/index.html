<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>prcoder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23238636'/%3E%3Ctext x='32' y='44' font-family='-apple-system,Helvetica,Arial,sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3EPR%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section id="pr" class="pane">
      <header>
        <h1>Pull request</h1>
        <select id="pr-switch" title="switch to another open pull request"></select>
        <button id="pr-commit" class="commit" hidden title="uncommitted changes block a branch switch">Commit…</button>
        <span id="pr-sync" class="light"></span>
        <button id="pr-refresh" title="reload from GitHub">⟳</button>
      </header>
      <div id="pr-head"></div>
      <div id="pr-body" class="scroll">Loading…</div>
    </section>
    <div id="gut-pr" class="gut col" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="resize the pull request pane" aria-valuemin="0" aria-valuemax="100"
         data-var="--w-pr" data-from="left"></div>

    <section id="diff" class="pane" hidden>
      <header>
        <h1>Diff</h1>
        <span id="diff-path"></span>
        <label id="diff-viewed-label"><input id="diff-viewed" type="checkbox" title="mark viewed on GitHub"> viewed</label>
        <!-- Diff first: it is what the pane itself shows. The other three need
             the PR's head commit and hide together, separators included, when a
             payload has none. -->
        <a id="diff-gh" target="_blank" rel="noopener" title="this file's diff in GitHub's viewer">Diff</a>
        <span id="diff-out">
          <span class="sep">·</span>
          <a id="diff-file" target="_blank" rel="noopener" title="the whole file at this pull request's head, on GitHub">File</a>
          <span class="sep">·</span>
          <a id="diff-blame" target="_blank" rel="noopener" title="who last touched each line of it">Blame</a>
          <span class="sep">·</span>
          <a id="diff-history" target="_blank" rel="noopener" title="the commits that have touched this file">History</a>
        </span>
        <button id="diff-close" title="close diff">✕</button>
      </header>
      <div id="diff-main">
        <div id="diff-body" class="scroll"></div>
        <!-- Inside the pane rather than between two of them, but the same
             gutter: it writes a distance from <main>'s right edge, which is the
             outline's own right edge, so the number is its width. -->
        <div id="gut-outline" class="gut col" role="separator" aria-orientation="vertical"
             tabindex="0" aria-label="resize the hunk outline" aria-valuemin="0" aria-valuemax="100"
             data-var="--w-outline" data-from="right"></div>
        <!-- One row per hunk, from the context git puts after the @@; a click
             scrolls the body to that hunk. Empty, and so hidden, for a whole file. -->
        <nav id="diff-outline" aria-label="hunks in this diff"></nav>
      </div>
    </section>
    <div id="gut-diff" class="gut row" role="separator" aria-orientation="horizontal"
         tabindex="0" aria-label="resize the diff pane" aria-valuemin="0" aria-valuemax="100"
         data-var="--h-diff" data-from="top"></div>

    <section id="term" class="pane">
      <header><h1>Claude Code</h1></header>
      <div id="term-host"></div>
    </section>
    <div id="gut-queue" class="gut row" role="separator" aria-orientation="horizontal"
         tabindex="0" aria-label="resize the queue pane" aria-valuemin="0" aria-valuemax="100"
         data-var="--h-queue" data-from="bottom"></div>

    <section id="queue" class="pane">
      <header>
        <h1>Queue</h1>
        <span id="queue-sync" class="light"></span>
        <textarea id="queue-input" rows="1" placeholder="Add an item, Enter to save" autocomplete="off"></textarea>
        <button id="queue-where" class="where" title="new items go to the bottom — click for the top">↓</button>
      </header>
      <div id="queue-body" class="scroll"></div>
    </section>
  </main>
  <div id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
