<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>prcoder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23238636'/%3E%3Ctext x='32' y='44' font-family='-apple-system,Helvetica,Arial,sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3EPR%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- data-folds is the switch for which panes fold to their header line
       (folds.js, and the fold rules in app.js): a pane named here gets a ▼
       before its title and a bar that folds on a click. The queue's fold is
       built and left off: prcoder is queue-first, so hiding the queue should
       stay hard until there is a reason for it. Add `queue` to turn it on. -->
  <main data-folds="diff term">
    <section id="pr" class="pane">
      <header>
        <h1>Pull request</h1>
        <select id="pr-switch" title="switch to another open pull request"></select>
        <button id="pr-commit" class="commit" hidden title="uncommitted changes block a branch switch">Commit…</button>
        <span id="pr-sync" class="light"></span>
        <button id="pr-refresh" title="reload from GitHub" aria-label="reload from GitHub">⟳</button>
      </header>
      <div id="pr-head"></div>
      <div id="pr-body" class="scroll">Loading…</div>
    </section>
    <div id="gut-pr" class="gut col" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="resize the pull request pane" aria-valuemin="0" aria-valuemax="100"
         data-var="--w-pr" data-from="left"></div>

    <section id="diff" class="pane" hidden>
      <header>
        <button id="diff-fold" aria-expanded="true" aria-controls="diff-main" title="collapse the diff pane" aria-label="collapse the diff pane">▼</button>
        <h1>Diff</h1>
        <!-- The name, its copy button and its @ take the header's spare room
             together, so the two sit against the name and the rest stays packed
             at the right. Copy first, so it is plainly the name it copies. -->
        <span id="diff-name">
          <span id="diff-path"></span>
          <button id="diff-copy" title="copy this file's path" aria-label="copy this file's path">⧉</button>
          <!-- Types an @ mention of this file into the coding agent's prompt;
               app.js wires it, and diff.js titles it and hides it for a deleted
               file. Not the queue's ▶, which would read as running the file. -->
          <button id="diff-mention" aria-label="mention this file to the coding agent">@</button>
        </span>
        <label id="diff-viewed-label"><input id="diff-viewed" type="checkbox" title="mark viewed on GitHub"> viewed</label>
        <!-- Diff first: it is what the pane itself shows. The other three need
             the PR's head commit and hide together, separators included, when a
             payload has none. -->
        <a id="diff-gh" target="_blank" rel="noopener" title="this file's diff in GitHub's viewer">Diff</a>
        <span id="diff-out">
          <span class="sep">·</span>
          <a id="diff-file" target="_blank" rel="noopener" title="the whole file at this pull request's head, on GitHub">File</a>
          <span class="sep">·</span>
          <a id="diff-blame" target="_blank" rel="noopener" title="who last touched each line of it">Blame</a>
          <span class="sep">·</span>
          <a id="diff-history" target="_blank" rel="noopener" title="the commits that have touched this file">History</a>
        </span>
        <!-- The view controls, kept apart from `viewed` above, which is a fact
             about the file on GitHub rather than a way of looking at it. Wrap is
             pressed or not (aria-pressed); the Outline button shows only while
             the outline is hidden and this file has one: style.css decides, so
             nothing has to repaint it per file. -->
        <button id="diff-wrap" aria-pressed="false" title="wrap long lines (Alt+W)">Wrap</button>
        <button id="diff-outline-show" title="show the hunk outline">Outline</button>
        <button id="diff-close" title="close diff" aria-label="close diff">✕</button>
      </header>
      <div id="diff-main">
        <div id="diff-body" class="scroll"></div>
        <!-- Inside the pane rather than between two of them, but the same
             gutter: it writes a distance from <main>'s right edge, which is the
             outline's own right edge, so the number is its width. -->
        <div id="gut-outline" class="gut col" role="separator" aria-orientation="vertical"
             tabindex="0" aria-label="resize the hunk outline" aria-valuemin="0" aria-valuemax="100"
             data-var="--w-outline" data-from="right"></div>
        <!-- One row per hunk, from the context git puts after the @@; a click
             scrolls the body to that hunk. Empty, and so hidden, for a whole file. -->
        <aside id="diff-side">
          <button id="diff-outline-hide" title="hide the outline" aria-label="hide the outline">✕</button>
          <nav id="diff-outline" aria-label="hunks in this diff"></nav>
        </aside>
      </div>
    </section>
    <div id="gut-diff" class="gut row" role="separator" aria-orientation="horizontal"
         tabindex="0" aria-label="resize the diff pane" aria-valuemin="0" aria-valuemax="100"
         data-var="--h-diff" data-from="top"></div>

    <section id="term" class="pane">
      <header>
        <button id="term-fold" aria-expanded="true" aria-controls="term-host" title="collapse the coding agent pane" aria-label="collapse the coding agent pane">▼</button>
        <h1>Claude Code</h1>
        <span id="term-busy" class="light busy" hidden>working</span>
      </header>
      <div id="term-host"></div>
      <!-- Once the PTY has gone, under what it last printed. Nothing will
           repaint the terminal by then, so prcoder is free to draw here.
           Filled with the model and effort prcoder's command line gave (app.js);
           blank fields keep whatever that was.
           Quit comes first and stands alone, so it is found without reading
           the bar; the settings sit ahead of the button they are settings for;
           and the checkbox, the least used thing here, goes to the far right
           with the note (style.css pushes it there). The fields keep the order
           model, effort, continue: it is the order of the /pty query. -->
      <form id="term-exit" hidden>
        <button type="button" id="term-quit" class="danger"
                title="Asks first when quitting would lose something">Quit prcoder</button>
        <label>Model <input name="model" list="term-models" placeholder="as started" size="10"
                            autocomplete="off" spellcheck="false"></label>
        <datalist id="term-models">
          <option value="fable"></option><option value="opus"></option>
          <option value="sonnet"></option><option value="haiku"></option>
        </datalist>
        <label>Effort <select name="effort">
          <option value="">as started</option><option>low</option><option>medium</option>
          <option>high</option><option>xhigh</option><option>max</option>
        </select></label>
        <button id="term-start" class="primary">Start coding agent</button>
        <label title="--continue: the most recent conversation in this repo">
          <input type="checkbox" name="continue"> Continue the conversation</label>
        <span>Coding agent has exited.</span>
      </form>
    </section>
    <div id="gut-queue" class="gut row" role="separator" aria-orientation="horizontal"
         tabindex="0" aria-label="resize the queue pane" aria-valuemin="0" aria-valuemax="100"
         data-var="--h-queue" data-from="bottom"></div>

    <section id="queue" class="pane">
      <header>
        <button id="queue-fold" aria-expanded="true" aria-controls="queue-body" title="collapse the queue pane" aria-label="collapse the queue pane">▼</button>
        <h1>Queue</h1>
        <!-- Adding always lands in Local, whichever tab is showing, so the
             placeholder names it: from Issues or Completed it is not obvious. -->
        <textarea id="queue-input" rows="1" placeholder="Add to Local…" autocomplete="off"></textarea>
        <button id="queue-where" class="where" title="new items go to the bottom — click for the top">↓</button>
      </header>
      <div id="queue-body" class="scroll"></div>
    </section>
  </main>
  <div id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
